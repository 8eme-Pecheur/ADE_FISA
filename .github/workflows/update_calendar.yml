name: Update ADE Calendar

on:
  schedule:
    # Exécution automatique toutes les heures
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de déclencher le script manuellement depuis GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Exécuter le script Python
        # Remplace app.py ci-dessous par le nom exact de ton fichier Python si besoin
        run: python app.py

      - name: Publier le fichier .ics sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: .
          keep_files: true